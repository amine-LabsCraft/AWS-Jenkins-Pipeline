# Lightweight mirror of the Jenkins quality gates, so every push on GitHub gets a badge.
# The full pipeline (Spark, dbt, Data Canary, AWS deploy) runs in Jenkins.
name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check sunops spark_jobs tests airflow
      - run: pytest -q --cov=sunops
      - name: Data contract compatibility with main
        run: |
          git show origin/main:contracts/telemetry.yml > /tmp/old.yml 2>/dev/null || : > /tmp/old.yml
          python -m sunops.contracts compat /tmp/old.yml contracts/telemetry.yml
      - name: Data Canary demo (a bug that unit tests miss)
        run: |
          python -m sunops.demo --scenario safe-refactor --out reports/safe
          ! python -m sunops.demo --scenario lost-dedup --out reports/bug
      - uses: actions/upload-artifact@v5
        if: always()
        with: {name: canary-reports, path: reports/}
