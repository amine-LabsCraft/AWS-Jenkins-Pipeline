<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <style>
      .st{fill:#ffffff;stroke:#d6d4ce;stroke-width:1.2}
      .t{font-size:13.5px;font-weight:700;fill:#0b0b0b}
      .s{font-size:11.5px;fill:#52514e}
      .m{font-size:11px;fill:#52514e;font-family:Consolas, Menlo, monospace}
      .flow{stroke:#52514e;stroke-width:2;fill:none}
      .dash{stroke:#8a8983;stroke-width:1.4;stroke-dasharray:5 4;fill:none}
    </style>
  </defs>
  <rect width="1100" height="440" rx="14" fill="#fcfcfb"/>
  <text x="27" y="36" font-size="20" font-weight="700" fill="#0b0b0b">Jenkinsfile : on teste le code, puis on teste les données</text>

  <!-- stages -->
  <g>
    <rect class="st" x="27" y="58" width="155" height="62" rx="10"/>
    <text x="42" y="84" class="t">1 · Build image</text>
    <text x="42" y="104" class="s">une image pour tout</text>
  </g>
  <g>
    <rect class="st" x="205" y="58" width="155" height="62" rx="10"/>
    <text x="220" y="84" class="t">2 · Quality gates</text>
    <text x="220" y="104" class="s">ruff · pytest · contrat</text>
  </g>
  <g>
    <rect x="383" y="58" width="155" height="62" rx="10" fill="#fff6e5" stroke="#eda100" stroke-width="2"/>
    <text x="398" y="84" class="t">3 · Data Canary</text>
    <text x="398" y="104" class="s">diff main vs branche</text>
  </g>
  <g>
    <rect class="st" x="561" y="58" width="155" height="62" rx="10"/>
    <text x="576" y="84" class="t">4 · Terraform plan</text>
    <text x="576" y="104" class="s">archivé avec le build</text>
  </g>
  <g>
    <rect class="st" x="739" y="58" width="155" height="62" rx="10"/>
    <text x="754" y="84" class="t">5 · Approbation</text>
    <text x="754" y="104" class="s">input manuel (main)</text>
  </g>
  <g>
    <rect class="st" x="917" y="58" width="155" height="62" rx="10"/>
    <text x="932" y="84" class="t">6 · Deploy AWS</text>
    <text x="932" y="104" class="s">ECR · S3 · EMR</text>
  </g>
  <path class="flow" d="M182 89 H203" marker-end="url(#a)"/>
  <path class="flow" d="M360 89 H381" marker-end="url(#a)"/>
  <path class="flow" d="M538 89 H559" marker-end="url(#a)"/>
  <path class="flow" d="M716 89 H737" marker-end="url(#a)"/>
  <path class="flow" d="M894 89 H915" marker-end="url(#a)"/>

  <!-- canary detail -->
  <path class="dash" d="M460 120 V160"/>
  <rect x="27" y="160" width="1045" height="255" rx="12" fill="#fffbf2" stroke="#f3c96b"/>
  <text x="47" y="188" class="t" fill="#7a5200">Zoom sur le Data Canary</text>

  <rect class="st" x="47" y="252" width="175" height="78" rx="10"/>
  <text x="62" y="278" class="t">Échantillon doré</text>
  <text x="62" y="298" class="s">seed 42 · 7 jours</text>
  <text x="62" y="316" class="s">identique à chaque build</text>

  <rect class="st" x="282" y="206" width="215" height="66" rx="10"/>
  <text x="297" y="232" class="t">Code de main (baseline)</text>
  <text x="297" y="254" class="m">→ schéma canary_baseline</text>

  <rect class="st" x="282" y="310" width="215" height="66" rx="10"/>
  <text x="297" y="336" class="t">Code de la branche</text>
  <text x="297" y="358" class="m">→ schéma canary_candidate</text>

  <path class="flow" d="M222 280 L280 245" marker-end="url(#a)"/>
  <path class="flow" d="M222 302 L280 338" marker-end="url(#a)"/>

  <rect class="st" x="557" y="226" width="240" height="132" rx="10"/>
  <text x="572" y="252" class="t">sunops.canary · diff Gold</text>
  <text x="572" y="276" class="s">• schéma : colonne supprimée / retypée</text>
  <text x="572" y="296" class="s">• lignes et clés (array_id, jour)</text>
  <text x="572" y="316" class="s">• taux de NULL par colonne</text>
  <text x="572" y="336" class="s">• Σ métriques + écarts ligne à ligne</text>

  <path class="flow" d="M497 239 L555 270" marker-end="url(#a)"/>
  <path class="flow" d="M497 343 L555 315" marker-end="url(#a)"/>

  <rect x="857" y="214" width="195" height="62" rx="10" fill="#e7f6e7" stroke="#0ca30c" stroke-width="1.5"/>
  <text x="872" y="240" class="t" fill="#065f06">✔ PROMOTE</text>
  <text x="872" y="260" class="s">score ≥ 85 et aucun FAIL</text>

  <rect x="857" y="308" width="195" height="62" rx="10" fill="#fbe9e9" stroke="#d03b3b" stroke-width="1.5"/>
  <text x="872" y="334" class="t" fill="#9b1c1c">✖ BLOCK</text>
  <text x="872" y="354" class="s">build rouge + rapport HTML</text>

  <path class="flow" d="M797 270 L855 248" marker-end="url(#a)"/>
  <path class="flow" d="M797 315 L855 338" marker-end="url(#a)"/>

  <text x="47" y="400" class="s">Le résultat est historisé dans ops.canary_runs et affiché dans Grafana : on suit la qualité des déploiements dans le temps.</text>
</svg>
