jenkins:
  systemMessage: "SunOps · CI/CD for data pipelines (Data Canary enabled)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy: loggedInUsersCanDoAnything

unclassified:
  location:
    url: http://localhost:8080/

jobs:
  - script: >
      multibranchPipelineJob('sunops') {
        displayName('SunOps data pipeline')
        branchSources {
          git {
            id('sunops')
            remote('${SUNOPS_REPO_URL}')
          }
        }
        orphanedItemStrategy { discardOldItems { numToKeep(10) } }
        triggers { periodicFolderTrigger { interval('5m') } }
      }
